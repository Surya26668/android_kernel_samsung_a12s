name: Build Kernel M12

# ------------------------------------------------------------------
# Build kernel Exynos 850 untuk Galaxy M12 (SM-M127F / m12nsxx)
# VERSI 2 — lebih tahan banting:
#   * GCC jadi pilihan UTAMA (dipasang lewat apt, pasti berhasil)
#   * clang jadi CADANGAN (URL sudah diverifikasi)
#   * defconfig dicoba beberapa nama
#   * tiap langkah ada continue-on-error + diagnosa
#
# Hasil: Image (kernel) + dtb + INFO.txt  -> artifact
# ------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Nama defconfig (tanpa _defconfig)'
        required: false
        default: 'exynos850-m12nsxx'
  push:
    branches:
      - lineage-24.0

jobs:
  build:
    name: Build kernel M12
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      DEFCONFIG: exynos850-m12nsxx

    steps:
      # ================= 1. SOURCE =================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Info source
        run: |
          echo "=== commit ==="
          git rev-parse HEAD
          git log -1 --oneline
          echo ""
          echo "=== defconfig yang tersedia ==="
          ls -la arch/arm64/configs/*.defconfig 2>/dev/null | head -40 || echo "(tidak ada *.defconfig)"
          echo ""
          echo "=== cari file terkait m12 ==="
          find arch/arm64/configs -iname "*m12*" 2>/dev/null || echo "(tidak ada)"

      # ================= 2. DEPENDENSI =================
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip zip unzip curl wget git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            device-tree-compiler cpio kmod libncurses-dev
          echo "=== versi gcc aarch64 ==="
          aarch64-linux-gnu-gcc --version | head -1
          echo "=== versi gcc arm32 ==="
          arm-linux-gnueabi-gcc --version | head -1

      # ================= 3. BUILD DENGAN GCC (UTAMA) =================
      - name: Build kernel (GCC)
        id: build_gcc
        continue-on-error: true
        run: |
          set -x
          export ARCH=arm64
          export SUBARCH=arm64
          export LC_ALL=C

          MAKE_ARGS="ARCH=arm64 O=out \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          echo "################ defconfig ################"
          # coba beberapa nama defconfig
          OK=0
          for DC in "$DEFCONFIG" "exynos850-m12nsxx" "exynos850-a12snsxx" "lineage_m12" "exynos850"; do
            echo ">>> mencoba: $DC"
            if [ -f "arch/arm64/configs/${DC}_defconfig" ]; then
              if make $MAKE_ARGS ${DC}_defconfig 2>&1 | tail -5; then
                echo ">>> BERHASIL pakai defconfig: $DC"
                echo "DEFCONFIG_DIPAKAI=$DC" >> $GITHUB_ENV
                OK=1
                break
              fi
            else
              echo "    (file arch/arm64/configs/${DC}_defconfig tidak ada)"
            fi
          done

          if [ "$OK" != "1" ]; then
            echo "### TIDAK ADA DEFCONFIG YANG COCOK ###"
            ls -la arch/arm64/configs/ || true
            exit 1
          fi

          echo "################ cek config penting ################"
          grep -E "CONFIG_MACH_SAMSUNG_M12|CONFIG_EXYNOS_KERNEL_PROTECTION|CONFIG_DM_VERITY|CONFIG_OVERLAY_FS" out/.config || true

          echo "################ build Image ################"
          make $MAKE_ARGS -j$(nproc) Image 2>&1 | tail -80
          RC=${PIPESTATUS[0]}
          echo ">>> exit code Image = $RC"

          echo "################ build dtb ################"
          make $MAKE_ARGS -j$(nproc) dtbs 2>&1 | tail -30 || true

          echo "################ hasil ################"
          ls -la out/arch/arm64/boot/ 2>/dev/null || echo "(boot/ kosong)"

          exit $RC

      # ================= 4. BUILD DENGAN CLANG (CADANGAN) =================
      - name: Build kernel (clang) — hanya kalau GCC gagal
        id: build_clang
        if: steps.build_gcc.outcome == 'failure'
        run: |
          set -x
          echo ">>> GCC gagal, mencoba clang..."

          mkdir -p $HOME/clang
          cd $HOME/clang
          URL="https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/archive/refs/heads/lineage-20.0.tar.gz"
          echo ">>> unduh: $URL"
          curl -fL --retry 3 --retry-delay 5 -o clang.tar.gz "$URL"
          ls -la clang.tar.gz
          tar -xzf clang.tar.gz
          CLANG_DIR=$(find $HOME/clang -maxdepth 3 -type d -name "bin" | head -1)
          export PATH="$CLANG_DIR:$PATH"
          echo ">>> clang: $(clang --version | head -1)"
          cd $GITHUB_WORKSPACE

          export ARCH=arm64
          export SUBARCH=arm64
          export LC_ALL=C

          MAKE_ARGS="ARCH=arm64 O=out CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          DC="$DEFCONFIG"
          [ -n "$DEFCONFIG_DIPAKAI" ] && DC="$DEFCONFIG_DIPAKAI"
          for C in "$DC" "exynos850-m12nsxx" "exynos850-a12snsxx" "lineage_m12"; do
            if [ -f "arch/arm64/configs/${C}_defconfig" ]; then
              make $MAKE_ARGS ${C}_defconfig 2>&1 | tail -5 && { echo "DEFCONFIG_DIPAKAI=$C" >> $GITHUB_ENV; break; }
            fi
          done

          make $MAKE_ARGS -j$(nproc) Image 2>&1 | tail -80
          make $MAKE_ARGS -j$(nproc) dtbs 2>&1 | tail -30 || true

      # ================= 5. DIAGNOSA =================
      - name: Diagnosa hasil
        if: always()
        run: |
          echo "===== hasil build_gcc   : ${{ steps.build_gcc.outcome }} ====="
          echo "===== hasil build_clang : ${{ steps.build_clang.outcome }} ====="
          echo ""
          echo "### CARI Image ###"
          find . -name "Image" -o -name "Image.gz" -o -name "zImage" 2>/dev/null | while read f; do
            echo "  $f  -> $(stat -c%s "$f") B"
          done
          echo ""
          echo "### ISI out/arch/arm64/boot/ ###"
          ls -la out/arch/arm64/boot/ 2>/dev/null || echo "  (kosong)"
          echo ""
          echo "### CARI dtb ###"
          find out -name "*.dtb" 2>/dev/null | head -20 || echo "  (tidak ada)"
          echo ""
          echo "### .config ada? ###"
          ls -la out/.config 2>/dev/null || echo "  (tidak ada)"
          echo ""
          echo "### 40 baris error terakhir (kalau ada) ###"
          if [ -f out/build.log ]; then tail -40 out/build.log; fi

      # ================= 6. SUSUN ARTIFACT =================
      - name: Susun berkas hasil
        if: always()
        run: |
          mkdir -p HASIL
          ADA=0

          for f in out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz \
                   arch/arm64/boot/Image arch/arm64/boot/Image.gz; do
            if [ -f "$f" ]; then cp "$f" HASIL/ && echo "kernel <- $f" && ADA=1; fi
          done

          if [ -d out/arch/arm64/boot/dts/exynos ]; then
            mkdir -p HASIL/dtb
            find out/arch/arm64/boot/dts/exynos -name "*.dtb" -exec cp {} HASIL/dtb/ \; 2>/dev/null
          elif [ -d out/arch/arm64/boot/dts ]; then
            mkdir -p HASIL/dtb
            find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} HASIL/dtb/ \; 2>/dev/null
          fi

          {
            echo "Commit       : $(git rev-parse HEAD)"
            echo "Branch       : $(git rev-parse --abbrev-ref HEAD)"
            echo "Tanggal      : $(date -u)"
            echo "Defconfig    : ${DEFCONFIG_DIPAKAI:-$DEFCONFIG}"
            echo "GCC outcome  : ${{ steps.build_gcc.outcome }}"
            echo "Clang outcome: ${{ steps.build_clang.outcome }}"
            echo "Kernel ada   : $ADA"
            echo ""
            echo "--- config penting ---"
            if [ -f out/.config ]; then
              grep -E "CONFIG_MACH_SAMSUNG_M12|CONFIG_EXYNOS_KERNEL_PROTECTION|CONFIG_DM_VERITY|CONFIG_OVERLAY_FS|CONFIG_LOCALVERSION|CONFIG_KSU" out/.config || true
              cp out/.config HASIL/config-final.txt
            fi
          } > HASIL/INFO.txt

          echo "=== ISI HASIL/ ==="
          ls -laR HASIL/

          if [ "$ADA" != "1" ]; then
            echo "::warning::Image TIDAK terbentuk - build gagal"
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-m12-${{ github.run_number }}
          path: HASIL/
          retention-days: 30
          if-no-files-found: warn

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "## Hasil Build Kernel M12"
            echo ""
            echo "| Item | Nilai |"
            echo "|---|---|"
            echo "| GCC | ${{ steps.build_gcc.outcome }} |"
            echo "| Clang | ${{ steps.build_clang.outcome }} |"
            echo "| Defconfig | ${DEFCONFIG_DIPAKAI:-$DEFCONFIG} |"
            echo ""
            echo "| Berkas | Ukuran |"
            echo "|---|---|"
            if [ -d HASIL ]; then
              find HASIL -type f -exec sh -c 'echo "| $(basename {}) | $(stat -c%s {}) B |"' \; 2>/dev/null
            fi
            echo ""
            echo "Unduh di tab **Actions** -> run terakhir -> **Artifacts**."
          } >> $GITHUB_STEP_SUMMARY
